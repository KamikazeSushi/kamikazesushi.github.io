<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Under Construction</title>
  <style>
    :root {
      --bg: #fafafa;
      --text: #2d3436;
      --accent: #6c5ce7;
      --accent-hover: #54a0ff;
      --card-bg: #ffffff;
      --ink-muted: #636e72;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      text-align: center;
      background: var(--card-bg);
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      max-width: 520px;
      width: 100%;
      border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .icon-wrapper {
      font-size: 2.5rem;
      margin-bottom: 20px;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 30px;
      color: var(--ink-muted);
    }

    .btn {
      display: inline-block;
      background-color: var(--accent);
      color: #ffffff;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
    }

    .btn:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(84, 160, 255, 0.2);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .countdown {
      margin-top: 35px;
      font-size: 0.85rem;
      color: #b2bec3;
      font-weight: 500;
    }

    #timer {
      font-weight: bold;
      color: var(--accent);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon-wrapper">🛠️</div>
    <h1>Project Under Construction</h1>
    <p>This specific page is currently inactive while the feature is being built. However, my main portfolio is live! Let's take you there to see my other works.</p>
    
    <a href="https://kamikazesushi.github.io/portfolio" class="btn">Explore Portfolio</a>

    <div class="countdown">
      Redirecting to the portfolio in <span id="timer">5</span> seconds...
    </div>
  </div>

  <script>
    const targetURL = "https://kamikazesushi.github.io/portfolio";
    let timeLeft = 5;
    const timerElement = document.getElementById('timer');

    // Countdown logic
    const countdownInterval = setInterval(() => {
      timeLeft--;
      timerElement.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(countdownInterval);
        window.location.href = targetURL; // Triggers the automatic redirect
      }
    }, 1000);
  </script>

</body>
</html>
